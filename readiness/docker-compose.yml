services:
  redis:
    image: redis:7-alpine
    container_name: readiness-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-demo_redis_secret_pass}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-demo_redis_secret_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: readiness-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-models/gemma-4-26b-a4b-it}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-models/gemma-4-31b-it}
      - FIRST_TOKEN_TIMEOUT_MS=${FIRST_TOKEN_TIMEOUT_MS:-2500}
      - THESYS_API_KEY=${THESYS_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_readiness_key_production_grade_38192}
      - DEMO_TECH_PASSWORD=${DEMO_TECH_PASSWORD:-tech123}
      - DEMO_SUPERVISOR_PASSWORD=${DEMO_SUPERVISOR_PASSWORD:-super123}
      - DATABASE_URL=sqlite+aiosqlite:///data/readiness.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-demo_redis_secret_pass}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-demo_neo4j_secret_pass}
      - ENABLE_NEO4J=${ENABLE_NEO4J:-false}
      - DASHBOARD_ORIGIN=${DASHBOARD_ORIGIN:-http://localhost:3000}
      - PORT=8000
    volumes:
      - sqlite_data:/app/data
      - ./knowledge:/app/knowledge
      - ./graph.yaml:/app/graph.yaml
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: readiness-dashboard
    ports:
      - "3000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: readiness-neo4j
    profiles:
      - graph
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-demo_neo4j_secret_pass}
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=128m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-demo_neo4j_secret_pass} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  redis_data:
  sqlite_data:
  neo4j_data:
